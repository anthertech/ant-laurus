[project]
name = "ant_laurus"
authors = [
    { name = "Hopeson", email = "hopeson@anther.tech"}
]
description = "Custom app for tracking laurus customization"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pypdf>=3.1.0,<4.0.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
